<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASCII Visual Engine — Demo</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          monospace;
        color: #00ff88;
      }

      #canvas {
        display: block;
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
      }

      #ui {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 10;
        max-width: 320px;
        padding: 16px;
        background: rgba(0, 0, 0, 0.75);
        border: 1px solid rgba(0, 255, 136, 0.3);
        border-radius: 8px;
        backdrop-filter: blur(8px);
        font-size: 13px;
        line-height: 1.5;
      }

      #ui h1 {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      #ui p {
        color: rgba(0, 255, 136, 0.7);
        margin-bottom: 12px;
        font-size: 12px;
      }

      .control-group {
        margin-bottom: 12px;
      }

      label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
        font-size: 12px;
      }

      select,
      input[type='range'] {
        width: 100%;
        accent-color: #00ff88;
      }

      select {
        background: #111;
        color: #00ff88;
        border: 1px solid rgba(0, 255, 136, 0.3);
        border-radius: 4px;
        padding: 6px 8px;
        margin-bottom: 8px;
      }

      .buttons {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 8px;
      }

      button {
        flex: 1;
        min-width: 80px;
        padding: 8px 12px;
        background: transparent;
        color: #00ff88;
        border: 1px solid rgba(0, 255, 136, 0.5);
        border-radius: 4px;
        cursor: pointer;
        font-family: inherit;
        font-size: 12px;
        transition: background 0.15s;
      }

      button:hover {
        background: rgba(0, 255, 136, 0.15);
      }

      button:active {
        background: rgba(0, 255, 136, 0.3);
      }

      .value {
        color: rgba(0, 255, 136, 0.6);
        font-size: 11px;
      }

      #fps {
        margin-top: 8px;
        font-size: 11px;
        color: rgba(0, 255, 136, 0.5);
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <div id="ui">
      <h1>ASCII Visual Engine</h1>
      <p>
        Fullscreen animated ASCII canvas. Change presets and sliders to alter
        glyphs and motion. Click Burst buttons to trigger noteOn bursts.
      </p>

      <div class="control-group">
        <label for="preset">Preset</label>
        <select id="preset"></select>
      </div>

      <div class="control-group">
        <label for="density">
          Density <span class="value" id="density-value"></span>
        </label>
        <input type="range" id="density" min="0.3" max="2" step="0.1" />
      </div>

      <div class="control-group">
        <label for="speed">
          Speed <span class="value" id="speed-value"></span>
        </label>
        <input type="range" id="speed" min="0.1" max="3" step="0.1" />
      </div>

      <div class="control-group">
        <label for="trailAmount">
          Trails <span class="value" id="trailAmount-value"></span>
        </label>
        <input type="range" id="trailAmount" min="0" max="1" step="0.05" />
      </div>

      <div class="control-group">
        <label for="glitchAmount">
          Glitch <span class="value" id="glitchAmount-value"></span>
        </label>
        <input type="range" id="glitchAmount" min="0" max="1" step="0.05" />
      </div>

      <div class="buttons">
        <button id="burst-center">Burst Center</button>
        <button id="burst-random">Burst Random</button>
      </div>

      <div id="fps">FPS: —</div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
