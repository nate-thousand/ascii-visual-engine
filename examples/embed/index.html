<!DOCTYPE html>
<!-- Minimal embed. Run `npm run build`, then serve the repo root. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ASCII Visual Engine embed</title>
    <style>html, body { margin: 0; height: 100%; background: #000; } canvas { display: block; }</style>
  </head>
  <body>
    <canvas id="ascii"></canvas>
    <script type="module">
      import { createEngine } from '../../dist/ascii-visual-engine.js';
      const canvas = document.getElementById('ascii');
      const engine = createEngine(canvas, { preset: 'glyphOrganicBloom' });
      engine.enablePointerInput();
      window.addEventListener('resize', () => engine.resize(innerWidth, innerHeight));
    </script>
  </body>
</html>
